name: CI Build Android

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: {}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Normalize Gradle properties for AGP 9
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradle.properties ]; then
            cp gradle.properties gradle.properties.bak

            sed -i '/^android.builtInKotlin[[:space:]]*=/d' gradle.properties
            sed -i '/^android.newDsl[[:space:]]*=/d' gradle.properties

            echo "Sanitized gradle.properties for AGP 9 migration"
            echo "--- gradle.properties ---"
            cat gradle.properties
          fi

      - name: Prepare CI config files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f stoatbuild.properties ]; then
          cat > stoatbuild.properties <<EOF
          build.debug.app_name=Stoat Debug
          build.flavour_id=${{ secrets.STOAT_FLAVOUR_ID != '' && secrets.STOAT_FLAVOUR_ID || 'ZZUU' }}
          sentry.dsn=${{ secrets.SENTRY_DSN }}
          sentry.upload_mappings=false
          EOF
          fi

          if [ ! -f app/google-services.json ] && [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          elif [ ! -f app/google-services.json ] && [ -f app/google-services.json.example ]; then
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon clean :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
